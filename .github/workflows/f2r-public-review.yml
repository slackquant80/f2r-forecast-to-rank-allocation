name: F2R Public Artifact PR Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "src/dashboard/**"
      - "release_manifest.json"
      - ".gitattributes"
      - ".gitignore"
      - ".streamlit/**"
      - "README.md"
      - "requirements.txt"
      - "ci/verify_release.py"
      - "ci/receive_private_review.py"
      - "ci/test_review_roundtrip.py"
      - ".github/workflows/f2r-public-review.yml"
      - ".github/workflows/f2r-private-intake-draft-pr.yml"
  push:
    branches: [main]
    paths:
      - "src/dashboard/**"
      - "release_manifest.json"
      - ".gitattributes"
      - ".gitignore"
      - ".streamlit/**"
      - "README.md"
      - "requirements.txt"
      - "ci/verify_release.py"
      - "ci/receive_private_review.py"
      - "ci/test_review_roundtrip.py"
      - ".github/workflows/f2r-public-review.yml"
      - ".github/workflows/f2r-private-intake-draft-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-release:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify negative gates and Python syntax
        run: |
          python3 -m py_compile ci/verify_release.py
          PYTHONDONTWRITEBYTECODE=1 python3 ci/verify_release.py --selftest
          python3 -m py_compile ci/receive_private_review.py
          PYTHONDONTWRITEBYTECODE=1 python3 ci/receive_private_review.py --selftest
          PYTHONDONTWRITEBYTECODE=1 python3 ci/test_review_roundtrip.py
      - name: Enforce reusable short-lived GitHub App only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('.github/workflows/f2r-private-intake-draft-pr.yml').read_text()
          assert 'actions/create-github-app-token@v3' in s
          assert 'permission-contents: read' in s
          assert 'repositories: research-multiasset' in s
          assert 'steps.source-reader.outputs.token' in s
          assert 'F2R_SOURCE_READ_TOKEN' not in s
          assert 'secrets.F2R_APP_PRIVATE_KEY' in s
          print('F2R_EPHEMERAL_GITHUB_APP_NO_PAT_FALLBACK_PASS')
          PY
      - name: If release files change, require exact live-identity and accounting contract
        shell: bash
        run: |
          set -euo pipefail
          # HEAD^1 is the PR's base for pull_request merge commits;
          # for main push it is the previous main commit.
          files="$(git diff --name-only HEAD^1 HEAD)"
          if printf '%s\n' "$files" | grep -Eq '^(src/dashboard/|release_manifest\.json$|\.gitattributes$|\.gitignore$|\.streamlit/|README\.md$|requirements\.txt$)'; then
            PYTHONDONTWRITEBYTECODE=1 python3 ci/verify_release.py --validate-release .
          else
            echo "F2R_CI_INFRA_ONLY_PASS_RELEASE_NOT_REVALIDATED"
            echo "Legacy deployed main is not certified until a real frozen release with witness passes."
          fi

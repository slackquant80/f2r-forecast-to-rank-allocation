name: F2R Canonical SlackQuant Live Identity Witness

on:
  pull_request:
    branches: [main]
    paths:
      - "ci/verify_live_witness.py"
      - ".github/workflows/f2r-streamlit-live-witness.yml"
  push:
    branches: [main]
    paths:
      # Source-state merge precedes the independently reviewed four-system Pages
      # promotion; do not launch a 240s expected-stale live probe for data-only merges.
      # Live bytes are certified by the Pages postdeploy verification instead.
      - "ci/verify_live_witness.py"
      - ".github/workflows/f2r-streamlit-live-witness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed-live-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Standalone deterministic negative tests
        run: |
          python3 -m py_compile ci/verify_live_witness.py
          python3 ci/verify_live_witness.py --selftest
      - name: SlackQuant deployed source-owned public JSON SHA parity
        if: github.event_name != 'pull_request'
        run: |
          python3 ci/verify_live_witness.py --timeout-seconds 240 --interval-seconds 10
      - name: Pull request cannot claim live release
        if: github.event_name == 'pull_request'
        run: |
          echo "PR code validated; Canonical SlackQuant public JSON SHA evidence is checked only after main merge."
